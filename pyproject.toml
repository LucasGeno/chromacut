[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chromacut"
version = "0.1.0"
description = "Extract clean icons from AI-generated chroma-key images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "markdown>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.scripts]
chromacut = "chromacut.cli:main"
