[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chromacut"
version = "0.2.0"
description = "Extract clean icons from AI-generated chroma-key images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pillow>=13.0.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "markdown>=3.4",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.scripts]
chromacut = "chromacut.cli:main"
