# Build the chromacut container in CI and publish it to GHCR, so the 1 GB
# lucas-platform droplet pulls a digest-pinned image instead of building it
# (lucas-platform docs/work/public-surface-rework ticket 09).
#
# Every run builds and smoke-tests the image with a read-only token. Only runs
# on refs/heads/main (a push, or a manual dispatch from main) hand the tested
# image to the publish job, the one job with packages: write, which pushes
# ghcr.io/lucasgeno/chromacut:sha-<commit> and :main and writes the digest to
# the job summary; lucas-platform pins that digest in
# compose/chromacut/compose.yml. Uses only the job's GITHUB_TOKEN.
name: image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lucasgeno/chromacut

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The droplet is linux/amd64. Load locally first so the smoke test runs
      # the exact image that is pushed afterwards.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: chromacut:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Same probe as the lucas-platform compose healthcheck: GET / answers 200.
      - name: Smoke test
        run: |
          docker run -d --name chromacut-smoke -p 6100:6100 chromacut:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:6100/; then
              docker rm -f chromacut-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs chromacut-smoke
          exit 1

      # Hand the exact image the smoke test ran to the publish job, not a rebuild.
      - name: Save image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output chromacut-image.tar chromacut:ci

      - name: Upload image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromacut-image
          path: chromacut-image.tar
          retention-days: 1
          if-no-files-found: error

  # The only job that can write packages. Runs only for refs/heads/main, so a
  # pull request or a dispatch from another branch can never move :main.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromacut-image

      - name: Load image
        run: docker load --input chromacut-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          for tag in "sha-${GITHUB_SHA}" main; do
            docker tag chromacut:ci "${IMAGE}:${tag}"
            docker push --quiet "${IMAGE}:${tag}"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")
          {
            echo "Pin in lucas-platform compose/chromacut/compose.yml:"
            echo
            echo "\`image: ${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
